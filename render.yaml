services:
  - type: worker
    name: cinema-by-telegram-bot
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:push && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: CinemaByTelegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cinema-by-telegram-db
          property: connectionString

databases:
  - name: cinema-by-telegram-db
    region: oregon
    plan: 256mb
    databaseName: streaming
    user: streaming
